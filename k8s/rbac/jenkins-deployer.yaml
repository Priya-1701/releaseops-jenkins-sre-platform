apiVersion: v1
kind: Namespace
metadata:
  name: releaseops-system
  labels:
    app.kubernetes.io/name: releaseops-system
    app.kubernetes.io/part-of: releaseops
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: jenkins-deployer
  namespace: releaseops-system
  labels:
    app.kubernetes.io/name: jenkins-deployer
    app.kubernetes.io/part-of: releaseops
automountServiceAccountToken: false
---
apiVersion: v1
kind: Secret
metadata:
  name: jenkins-deployer-token
  namespace: releaseops-system
  annotations:
    kubernetes.io/service-account.name: jenkins-deployer
  labels:
    app.kubernetes.io/name: jenkins-deployer
    app.kubernetes.io/part-of: releaseops
type: kubernetes.io/service-account-token
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: releaseops-environment-deployer
  labels:
    app.kubernetes.io/name: jenkins-deployer
    app.kubernetes.io/part-of: releaseops
rules:
  - apiGroups:
      - apps
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - patch
      - update

  - apiGroups:
      - apps
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - ""
    resources:
      - pods
      - services
      - endpoints
      - events
    verbs:
      - get
      - list
      - watch

  - apiGroups:
      - ""
    resources:
      - pods/log
    verbs:
      - get

  - apiGroups:
      - ""
    resources:
      - pods/portforward
    verbs:
      - create
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: incident-dev
  labels:
    app.kubernetes.io/name: jenkins-deployer
    app.kubernetes.io/part-of: releaseops
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: releaseops-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: releaseops-environment-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: jenkins-deployer
  namespace: incident-staging
  labels:
    app.kubernetes.io/name: jenkins-deployer
    app.kubernetes.io/part-of: releaseops
subjects:
  - kind: ServiceAccount
    name: jenkins-deployer
    namespace: releaseops-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: releaseops-environment-deployer
