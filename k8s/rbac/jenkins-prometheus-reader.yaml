apiVersion: rbac.authorization.k8s.io/v1
kind: Role

metadata:
  name: jenkins-prometheus-port-forward
  namespace: monitoring

  labels:
    app.kubernetes.io/name: jenkins-prometheus-port-forward
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: releaseops

rules:
  - apiGroups:
      - ""

    resources:
      - services
      - endpoints
      - pods

    verbs:
      - get
      - list

  - apiGroups:
      - ""

    resources:
      - pods/portforward

    verbs:
      - create

---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding

metadata:
  name: jenkins-prometheus-port-forward
  namespace: monitoring

  labels:
    app.kubernetes.io/name: jenkins-prometheus-port-forward
    app.kubernetes.io/component: rbac
    app.kubernetes.io/part-of: releaseops

subjects:
  - kind: ServiceAccount

    name: jenkins-deployer

    namespace: releaseops-system

roleRef:
  apiGroup: rbac.authorization.k8s.io

  kind: Role

  name: jenkins-prometheus-port-forward
