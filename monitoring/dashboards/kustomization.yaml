apiVersion: kustomize.config.k8s.io/v1beta1

kind: Kustomization

namespace: monitoring

configMapGenerator:
  - name: releaseops-incident-api-dashboard

    files:
      - releaseops-incident-api.json

generatorOptions:
  disableNameSuffixHash: true

  labels:
    grafana_dashboard: "1"

    app.kubernetes.io/name: releaseops-incident-api-dashboard

    app.kubernetes.io/component: dashboard

    app.kubernetes.io/part-of: releaseops
